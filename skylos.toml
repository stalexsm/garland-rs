# Конфиг сканера skylos: гейт CI (джоба skylos в .github/workflows/ci.yml)
# запускается командой:
#   skylos . --secrets --danger --gate --config-file skylos.toml \
#     --exclude target
# Файл подхватывается skylos и без --config-file; флаг оставлен явным.

[tool.skylos]
# SKY-D260 (гомоглифы) глушим целиком — единственное исключение из правила
# «находки правятся, не прячутся»: репозиторий русскоязычный по конвенции
# (AGENTS.md), правило ловит русские «о», «с», «р» как подмену латиницы
# (o, c, p) в документации, комментариях и md-файлах и всегда даёт ложные
# срабатывания (~160 на текущем дереве, проверено на skylos 4.50.1).
# Остальные danger-правила активны.
ignore = ["SKY-D260"]
