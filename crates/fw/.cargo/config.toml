# Настройки компиляции — здесь, пользовательские значения esp-config — в `esp-config.toml`.
include = ["esp-config.toml"]

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6"

[build]
rustflags = [
  # Нужно для бэктрейсов esp-backtrace; замедляет генерируемый код.
  "-C", "force-frame-pointers",
]

target = "riscv32imac-unknown-none-elf"
