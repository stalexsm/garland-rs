# Настройки компиляции — здесь, пользовательские значения esp-config — в `esp-config.toml`.
include = ["esp-config.toml"]

[target.riscv32imac-unknown-none-elf]
# Свой Загрузчик с автооткатом (артефакт и рецепт пересборки — в bootloader/):
# прекомпилированный espflash откат не умеет.
runner = "espflash flash --monitor --chip esp32c6 --partition-table partitions.csv --bootloader bootloader/esp32c6-rollback.bin"

[build]
rustflags = [
  # Нужно для бэктрейсов esp-backtrace; замедляет генерируемый код.
  "-C", "force-frame-pointers",
]

target = "riscv32imac-unknown-none-elf"
