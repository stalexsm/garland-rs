[package]
name = "fw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Прошивка Гирлянды на ESP32-C6: каркас на esp-hal/esp-rtos"
publish = false

[dependencies]
garland-core.workspace = true
effect-precipitation.workspace = true
effect-pulse.workspace = true
effect-rainbow.workspace = true
effect-rings.workspace = true
effect-solid.workspace = true
effect-sparkle.workspace = true
heapless.workspace = true
log.workspace = true

# Железные крейты — только под target прошивки; на хосте fw собирается
# пустой заглушкой, чтобы workspace-гейты шли без железа.
[target.'cfg(target_arch = "riscv32")'.dependencies]
embassy-executor = { version = "0.10.0", features = ["log"] }
# Сетевой стек поверх Wi-Fi-драйвера esp-radio; dhcpv4-hostname даёт DHCP
# Option 12 — имя Гирлянды в роутере.
embassy-net = { version = "0.9.1", default-features = false, features = [
  "dhcpv4-hostname",
  "medium-ethernet",
  "tcp",
] }
embassy-time = { version = "0.5.1", features = ["log"] }
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = [
  "esp32c6",
  "log-04",
  "embedded-storage",
] }
# Флеш: чтение таблицы разделов и NVS-хранилище Текущего эффекта.
esp-storage = { version = "0.10.0", features = ["esp32c6"] }
# Ключ-значение поверх NVS-раздела: износостойкость и живучесть при сбросе
# питания решены проверенным крейтом (map API поверх async NorFlash).
sequential-storage = "8.0.2"
# Мост блокирующего NorFlash-вида NVS-раздела в async-трейты sequential-storage.
embassy-embedded-hal = "0.6.0"
# block_on для синхронной NVS-записи при переключении эффекта.
embassy-futures = "0.1.2"
esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }
# Драйвер Ленты: RMT-TX адаптер smart-leds с таймингами WS2812B (порядок GRB);
# RMT в esp-hal 1.x нестабилен, потому у esp-hal включена feature `unstable`.
esp-hal-smartled = "0.18.0"
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c6", "log-04", "wifi"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }
# Тип RGB8 и трейт SmartLedsWriteAsync для драйвера; версия — из
# dev-dependencies самого esp-hal-smartled 0.18.
smart-leds = "0.4"
