# Корень Rust workspace Гирлянды: все крейты живут в crates/.
[workspace]
resolver = "3"
members = ["crates/fw", "crates/garland-core", "crates/effects/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# effects
effect-balls = { path = "crates/effects/effect-balls" }
effect-clouds = { path = "crates/effects/effect-clouds" }
effect-confetti = { path = "crates/effects/effect-confetti" }
effect-fire = { path = "crates/effects/effect-fire" }
effect-lava = { path = "crates/effects/effect-lava" }
effect-matrix = { path = "crates/effects/effect-matrix" }
effect-plasma = { path = "crates/effects/effect-plasma" }
effect-rainbow-diag = { path = "crates/effects/effect-rainbow-diag" }
effect-rainbow-veil = { path = "crates/effects/effect-rainbow-veil" }
effect-snowfall = { path = "crates/effects/effect-snowfall" }
effect-starfall = { path = "crates/effects/effect-starfall" }
effect-waves = { path = "crates/effects/effect-waves" }

# core
garland-core = { path = "crates/garland-core" }

# crates
# криптография (сверка SHA256 OTA-образа)
sha2 = "0.11.1"
heapless = "0.9.1"
log = "0.4.34"

# Профили прошивки (канон шаблона esp-generate): dev-сборка без оптимизаций
# слишком медленная и жирная для микроконтроллера.
[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM работает быстрее на одном потоке
debug = 2 # медленнее сборка, но лучше отладка
lto = "fat"
opt-level = "s"
